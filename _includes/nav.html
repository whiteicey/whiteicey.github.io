<!-- Navigation -->
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li>
                        <a href="{{ site.baseurl }}/">Home</a>
                    </li>
                    {% for page in site.pages %}{% if page.title %}
                    <li>
                        <a href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
                    </li>
                    {% endif %}                    {% endfor %}
                    <li>
                        <a id="search-toggle" href="javascript:void(0)" class="nav-search-btn" aria-label="Search" title="搜索 (Ctrl+K)">
                            <svg class="svg-icon svg-icon-search" aria-hidden="true"><use href="#icon-search"></use></svg>
                        </a>
                    </li>
                    <li>
                        <a id="theme-toggle" href="javascript:void(0)" class="theme-toggle" aria-label="Toggle dark mode" title="切换暗色/亮色模式">
                            <span class="theme-icon">🌙</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <!-- /.navbar-collapse -->
    </div>
    <!-- /.container -->
</nav>
<script>
    // Drop Bootstrap low-performance Navbar
    // Use customize navbar with high-quality material design animation
    // in high-perf jank-free CSS3 implementation
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function(){
            if (!$navbar || !$navbar.classList.contains('in')) return;
            $navbar.classList.remove('in');
            // wait until animation end.
            setTimeout(function(){
                if ($navbar && !$navbar.classList.contains('in')) {
                    if (window.innerWidth < 768 && $collapse) {
                        $collapse.style.height = "0px";
                    } else if ($collapse) {
                        $collapse.style.height = "";
                    }
                }
            }, 400);
        },
        open: function(){
            if (!$navbar || !$collapse) return;
            $collapse.style.height = "auto";
            $navbar.classList.add('in');
        }
    };

    // Bind Event
    if ($toggle) {
        $toggle.addEventListener('click', function(e){
            e.stopPropagation();
            if ($navbar && $navbar.classList.contains('in')) {
                __HuxNav__.close();
            } else {
                __HuxNav__.open();
            }
        });
    }

    // Only close when click outside while mobile menu is open
    document.addEventListener('click', function(e){
        if (!$navbar || !$navbar.classList.contains('in')) return;
        if ($toggle && ($toggle === e.target || $toggle.contains(e.target))) return;
        if ($collapse && $collapse.contains(e.target) && !e.target.closest('a')) return;
        __HuxNav__.close();
    });

    // Reset inline height on viewport resize
    window.addEventListener('resize', function(){
        if (window.innerWidth >= 768) {
            if ($collapse) $collapse.style.height = "";
            if ($navbar) $navbar.classList.remove('in');
        }
    });
</script>
